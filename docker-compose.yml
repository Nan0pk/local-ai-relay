services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-ai-relay
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      - HOST=0.0.0.0
      - PORT=8787
      - LOG_LEVEL=info
      - RELAY_UNSAFE_BIND_ACK=1
      - RELAY_API_TOKEN=${RELAY_API_TOKEN:?Set RELAY_API_TOKEN to a strong random value}
    volumes:
      - relay-data:/home/node/.local-ai-relay
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  relay-data:
