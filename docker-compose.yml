version: '3.8'

services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-ai-relay
    ports:
      - "8787:8787"
    environment:
      - HOST=0.0.0.0
      - PORT=8787
      - LOG_LEVEL=info
      - RELAY_UNSAFE_BIND_ACK=1
      - RELAY_API_TOKEN=${RELAY_API_TOKEN:-local-ai-relay-token}
    volumes:
      - relay-data:/home/node/.local-ai-relay
    restart: unless-stopped

volumes:
  relay-data:
